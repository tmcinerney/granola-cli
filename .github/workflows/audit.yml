name: Audit

# AIDEV-NOTE: separate from CI on purpose. Advisories appear without any change
# to this repo, so this runs on a schedule as well as when the lockfile moves —
# a PR-only audit would go stale between contributions. Kept out of ci.yml so
# the weekly run does not rebuild the whole three-OS test matrix.

on:
  schedule:
    # Mondays, matching the dependabot schedule so findings and bumps line up.
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", ".github/workflows/audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: audit

      # AIDEV-NOTE: installed rather than using rustsec/audit-check, so this
      # workflow adds no third-party action. That is the same reasoning behind
      # SHA-pinning the others — the audit job should not widen the supply-chain
      # surface it exists to protect.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # --deny warnings also fails on unmaintained crates, not just
      # vulnerabilities. Verified clean at the time of writing. If an advisory
      # lands on a dependency kept deliberately — serde_yaml is deprecated but
      # retained, see the note in src/output.rs — add an explicit
      # `--ignore RUSTSEC-XXXX-NNNN` here with the reason, rather than dropping
      # the flag and losing the whole class of finding.
      - name: Audit dependencies
        run: cargo audit --deny warnings
