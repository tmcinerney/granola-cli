name: Release

# AIDEV-NOTE: third-party actions are pinned to commit SHAs, not tags. A tag is
# mutable, so `@v2` can be repointed at new code by whoever controls the repo.
# That matters here because release.yml holds an Apple Developer ID signing key
# and `contents: write` — a compromised action could sign and publish arbitrary
# binaries under a trusted identity. The trailing comment records the human
# version; Dependabot updates both together.

# Tagging v* triggers a build matrix that uploads platform binaries
# to the matching GitHub Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Serialise runs per tag, but never cancel: a cancelled release can leave a
# partially-uploaded draft behind. v0.5.4 had to be deleted by hand for exactly
# this reason.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Match CI, so a release build cannot pass with warnings CI would reject.
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # AIDEV-NOTE: nothing else ties the tag to the crate version. Tagging
      # v0.6.0 with Cargo.toml still at 0.5.5 would produce assets named
      # granola-v0.6.0-* containing a binary that reports 0.5.5 — the Homebrew
      # formula's version assertion would catch it, but only after the tap was
      # updated. Fail here instead, before anything is built.
      - name: Tag must match Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CRATE=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "$CRATE" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CRATE}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches Cargo.toml ${CRATE}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: release-${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # AIDEV-NOTE: sign macOS binaries with an Apple Developer ID certificate.
      #
      # The problem this solves is not Gatekeeper — Homebrew installs via curl,
      # which never sets com.apple.quarantine, so Gatekeeper is never consulted.
      # It is the macOS keychain. A grant ("always allow") is bound to a
      # partition, and a signer without an Apple Team Identifier falls back to a
      # per-build `cdhash:` partition — so every new version re-prompted for the
      # login password. A Developer ID signature gives a stable
      # `teamid:KMWQ959CHU` partition and a designated requirement pinned to the
      # team OU rather than the code hash.
      #
      # Verified empirically: four never-granted builds signed this way read the
      # credential silently, while a self-signed control prompted every time.
      # A self-signed certificate cannot fix this, because it has no team ID.
      #
      # Because the requirement pins the team OU and not the certificate,
      # renewing the cert (expires 2027-02-01) preserves existing grants.
      #
      # Key lives in 1Password: "granola-cli Apple Developer ID signing"
      # (Dev Secrets, personal account). GitHub secrets are write-only, so that
      # item is the only recoverable copy — Apple allows the private key to be
      # downloaded once.
      - name: Sign (macOS)
        if: contains(matrix.target, 'apple-darwin')
        # A hang here means something is waiting on a prompt that cannot be
        # answered. Fail in minutes rather than burning the job.
        timeout-minutes: 5
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          SIGNING_IDENTITY: "Developer ID Application: Travers McInerney (KMWQ959CHU)"
        run: |
          set -euo pipefail

          if [ -z "${MACOS_SIGNING_P12:-}" ] || [ -z "${MACOS_SIGNING_P12_PASSWORD:-}" ]; then
            echo "::error::signing secrets are missing; refusing to publish an unsigned macOS binary"
            exit 1
          fi

          BIN="target/${TARGET}/release/granola"
          WORK=$(mktemp -d)
          KEYCHAIN="$WORK/signing.keychain-db"
          trap 'security delete-keychain "$KEYCHAIN" 2>/dev/null || true; rm -rf "$WORK"' EXIT

          printf '%s' "$MACOS_SIGNING_P12" | base64 -d > "$WORK/cert.p12"

          security create-keychain -p "$MACOS_SIGNING_P12_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_SIGNING_P12_PASSWORD" "$KEYCHAIN"
          security import "$WORK/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_SIGNING_P12_PASSWORD" "$KEYCHAIN" >/dev/null

          # AIDEV-NOTE: no add-trusted-cert step. A Developer ID certificate
          # chains to Apple's root, which is already trusted everywhere. The
          # self-signed predecessor needed an explicit trust write, and the
          # user-domain form of that blocked forever on a headless runner —
          # v0.5.4 hung for 29 minutes before being cancelled.

          # codesign only searches keychains on the search list.
          ORIGINAL=$(security list-keychains -d user | tr -d ' "')
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $ORIGINAL

          codesign --force --timestamp \
            -s "$SIGNING_IDENTITY" -i com.tmcinerney.granola "$BIN"

          # shellcheck disable=SC2086
          security list-keychains -d user -s $ORIGINAL

          # AIDEV-NOTE: load-bearing. codesign exits 0 when it cannot find the
          # identity — it prints "no identity found" and leaves the binary
          # untouched — so exit status alone would ship unsigned binaries whose
          # only symptom is the password prompts returning.
          REQ=$(codesign -d --requirements - "$BIN" 2>&1 || true)
          echo "$REQ"
          if ! grep -q 'subject.OU. = KMWQ959CHU' <<<"$REQ"; then
            echo "::error::designated requirement is not pinned to the signing team; binary is not properly signed"
            exit 1
          fi
          if grep -q 'cdhash' <<<"$REQ"; then
            echo "::error::designated requirement still pins the cdhash; signing did not take effect"
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$BIN"

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          STAGE="granola-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "$STAGE"
          cp "target/${TARGET}/release/granola" "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          STAGE="granola-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "$STAGE"
          cp "target/${TARGET}/release/granola.exe" "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          7z a "${STAGE}.zip" "$STAGE"
          sha256sum "${STAGE}.zip" > "${STAGE}.zip.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            granola-*.tar.gz
            granola-*.tar.gz.sha256
            granola-*.zip
            granola-*.zip.sha256
          # Each matrix job only produces one archive type, so its glob for the
          # other necessarily matches nothing. The completeness guarantee comes
          # from the verify job below, not from this flag.
          fail_on_unmatched_files: false
          # AIDEV-NOTE: draft until every asset is confirmed present. v0.5.3
          # published with 3 of 5 targets and looked successful, because
          # fail-fast is false and each job uploads independently. A draft is
          # invisible and undownloadable, so an incomplete release cannot be
          # consumed; the verify job promotes it only when it is whole.
          draft: true
          prerelease: false

  verify:
    name: verify and publish
    needs: build
    # Runs even when a build job fails, so an incomplete draft is reported
    # rather than silently left behind.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every expected asset must be present, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # AIDEV-NOTE: keep in step with the build matrix above.
          TARGETS=(
            "aarch64-apple-darwin:tar.gz"
            "x86_64-apple-darwin:tar.gz"
            "x86_64-unknown-linux-gnu:tar.gz"
            "x86_64-unknown-linux-musl:tar.gz"
            "x86_64-pc-windows-msvc:zip"
          )

          present=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[].name' | sort)
          echo "published assets:"
          echo "$present"

          missing=()
          for spec in "${TARGETS[@]}"; do
            target="${spec%%:*}"
            archive="${spec##*:}"
            for name in \
              "granola-${GITHUB_REF_NAME}-${target}.${archive}" \
              "granola-${GITHUB_REF_NAME}-${target}.${archive}.sha256"; do
              if ! grep -qxF "$name" <<<"$present"; then
                missing+=("$name")
              fi
            done
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::release is incomplete; leaving it as a draft"
            for name in "${missing[@]}"; do
              echo "::error::missing $name"
            done
            exit 1
          fi

          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "all $(( ${#TARGETS[@]} * 2 )) assets present; release published"
