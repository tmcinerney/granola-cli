name: Release

# Tagging v* triggers a build matrix that uploads platform binaries
# to the matching GitHub Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # AIDEV-NOTE: sign macOS binaries with a stable self-signed certificate.
      #
      # An ad-hoc signature's designated requirement is the cdhash, which changes
      # with every build, so the macOS keychain treats each release as a
      # different application and cannot keep an "always allow" grant — users get
      # a login-password prompt on every upgrade. Signing with a fixed
      # certificate makes the requirement identifier+certificate based, so the
      # grant survives version bumps.
      #
      # Deliberately NOT an Apple Developer ID: these binaries are not notarized
      # and Gatekeeper rejects them. That is fine because Homebrew installs via
      # curl, which never sets com.apple.quarantine, so Gatekeeper is not
      # consulted. Only a browser download of the tarball would trip it.
      #
      # The cert lives in 1Password ("granola-cli macOS code signing", Dev
      # Secrets). GitHub secrets are write-only, so that item is the only
      # recoverable copy — losing it means future releases sign with a different
      # certificate, permanently re-triggering the prompts.
      - name: Sign (macOS)
        if: contains(matrix.target, 'apple-darwin')
        # A hang here means something is waiting on an interactive prompt that
        # cannot be answered; fail in minutes rather than burning the job.
        timeout-minutes: 5
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail

          # Refuse to publish an unsigned macOS binary by accident.
          if [ -z "${MACOS_SIGNING_P12:-}" ] || [ -z "${MACOS_SIGNING_P12_PASSWORD:-}" ]; then
            echo "::error::signing secrets are missing; refusing to publish an unsigned macOS binary"
            exit 1
          fi

          BIN="target/${TARGET}/release/granola"
          WORK=$(mktemp -d)
          KEYCHAIN="$WORK/signing.keychain-db"
          trap 'security delete-keychain "$KEYCHAIN" 2>/dev/null || true; rm -rf "$WORK"' EXIT

          # AIDEV-NOTE: the certificate is read from the repo, not extracted
          # from the .p12, because the two toolchains disagree on PKCS#12
          # algorithms and there is no format both accept. A p12 macOS can
          # import uses legacy RC2-40-CBC, which OpenSSL 3 refuses without the
          # legacy provider; one written with AES-256-CBC and a SHA-256 MAC is
          # readable by OpenSSL 3 but makes `security import` fail with "MAC
          # verification failed". Since a certificate is public there is no
          # reason to derive it from the encrypted bundle at all — this removes
          # the conflict instead of negotiating it, and makes the signing
          # identity auditable from the repo.
          printf '%s' "$MACOS_SIGNING_P12" | base64 -d > "$WORK/cert.p12"
          cp .github/signing-cert.pem "$WORK/cert.pem"

          security create-keychain -p "$MACOS_SIGNING_P12_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_SIGNING_P12_PASSWORD" "$KEYCHAIN"
          security import "$WORK/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_SIGNING_P12_PASSWORD" "$KEYCHAIN" >/dev/null

          # codesign refuses an untrusted identity outright, reporting
          # "no identity found" — while still exiting 0. Trust is required.
          #
          # AIDEV-NOTE: must be the admin domain (-d, System.keychain) via sudo.
          # The user-domain form works interactively but blocks forever on a
          # headless runner waiting for an authorization dialog that can never
          # appear — v0.5.4 hung here for 29 minutes before being cancelled.
          # GitHub-hosted runners have passwordless sudo, so the admin domain
          # writes without prompting.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$WORK/cert.pem"

          # codesign only searches keychains on the search list.
          ORIGINAL=$(security list-keychains -d user | tr -d ' "')
          # $ORIGINAL is a whitespace-separated list of keychain paths and must
          # word-split into separate arguments here.
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $ORIGINAL

          codesign --force --timestamp=none \
            -s "granola-cli code signing" -i com.tmcinerney.granola "$BIN"

          # shellcheck disable=SC2086
          security list-keychains -d user -s $ORIGINAL

          # AIDEV-NOTE: this check is load-bearing. codesign exits 0 when it
          # cannot find the identity, so exit status alone would happily ship an
          # unsigned binary and the only symptom would be users' password
          # prompts coming back. Assert the requirement actually changed shape.
          REQ=$(codesign -d --requirements - "$BIN" 2>&1 || true)
          echo "$REQ"
          if ! grep -q 'certificate root' <<<"$REQ"; then
            echo "::error::designated requirement is not certificate-based; the binary is not properly signed"
            exit 1
          fi
          if grep -q 'cdhash' <<<"$REQ"; then
            echo "::error::designated requirement still pins the cdhash; signing did not take effect"
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$BIN"
          echo "signed: $REQ"

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          STAGE="granola-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "$STAGE"
          cp "target/${TARGET}/release/granola" "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          STAGE="granola-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "$STAGE"
          cp "target/${TARGET}/release/granola.exe" "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          7z a "${STAGE}.zip" "$STAGE"
          sha256sum "${STAGE}.zip" > "${STAGE}.zip.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            granola-*.tar.gz
            granola-*.tar.gz.sha256
            granola-*.zip
            granola-*.zip.sha256
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
