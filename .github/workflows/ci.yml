name: CI

# AIDEV-NOTE: third-party actions are pinned to commit SHAs, not tags. A tag is
# mutable, so `@v2` can be repointed at new code by whoever controls the repo.
# That matters here because release.yml holds an Apple Developer ID signing key
# and `contents: write` — a compromised action could sign and publish arbitrary
# binaries under a trusted identity. The trailing comment records the human
# version; Dependabot updates both together.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo. Without this the job inherits the
# repository default, which may be read/write.
permissions:
  contents: read

# Supersede in-flight runs for the same ref. Cancelling is safe for CI (no
# side effects) but is deliberately NOT used for releases, where a cancelled
# run could leave a half-uploaded release behind.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A job that hangs on an interactive prompt would otherwise burn the
    # 6-hour default; v0.5.4's release sat for 29 minutes before anyone noticed.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Tests
        run: cargo test --all-targets

      - name: Build (release)
        run: cargo build --release

  msrv:
    name: msrv (declared minimum)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          V=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          if [ -z "$V" ]; then
            echo "::error::no rust-version in Cargo.toml"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install the declared minimum toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      # AIDEV-NOTE: builds only — no clippy or fmt. Their lints move between
      # releases, so running them on an old toolchain reports failures that say
      # nothing about whether the crate compiles at its stated minimum.
      - name: Build at the declared MSRV
        run: cargo build --all-targets
