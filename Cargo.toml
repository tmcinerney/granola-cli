[package]
name = "granola-cli"
version = "0.5.0"
edition = "2021"
# AIDEV-NOTE: raised from 1.74 by rmcp 3, which is edition 2024 and declares
# rust-version 1.88 (as do its darling/rmcp-macros deps). CI only builds on
# `stable`, so it will not catch this drifting out of date — check with
# `cargo metadata` when bumping deps.
rust-version = "1.88"
description = "Unofficial CLI and MCP server for Granola meeting notes (with credential-storage fix for Granola desktop ≥7.162)"
authors = ["Travers McInerney"]
license = "MIT"
repository = "https://github.com/tmcinerney/granola-cli"
homepage = "https://github.com/tmcinerney/granola-cli"
readme = "README.md"
keywords = ["granola", "cli", "meetings", "transcripts", "mcp"]
categories = ["command-line-utilities"]

[[bin]]
name = "granola"
path = "src/main.rs"

[dependencies]
aes = "0.9"
aes-gcm = "0.11"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
cbc = { version = "0.2", features = ["alloc"] }
ureq = { version = "2.10", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
directories = "6"
fd-lock = "4"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
comfy-table = "7"
pbkdf2 = "0.13"
sha1 = "0.11"
# AIDEV-NOTE: MCP server behind `granola mcp`. rmcp's default features already
# include `macros` + `server`; `transport-io` is what adds the stdio transport.
# `server` pulls in schemars 1.x and the tool-argument structs derive JsonSchema
# against it, so keep the schemars major in step with rmcp's when bumping either.
rmcp = { version = "3", features = ["transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
